name: CI

on:
  pull_request:
  push:
    branches: [master]

# One run at a time across all branches: every run shares the one ci database, and two
# runs of the same spec would delete each other's rows. GitHub keeps only one waiting
# run per group, so a newer one cancels the older waiting one.
concurrency:
  group: ci-db
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # A Neon branch only CI uses: the specs create and delete rows, so never the prod database.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the DATABASE_URL secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add a DATABASE_URL repository secret (a Neon ci branch, not prod)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      # playwright.config.ts runs the tests in Google Chrome (channel: "chrome").
      - run: npx playwright install --with-deps chrome

      # Builds the app, starts it on :3100 and runs every spec (see playwright.config.ts).
      - run: npm run pw:run

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
